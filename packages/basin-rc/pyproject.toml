[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basin-rc"
version = "0.1.0a2"
requires-python = ">=3.10"
description = "Offline basin computer alpha candidate"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.1"]

[project.optional-dependencies]
validation = ["jsonschema>=4.18,<5"]

[tool.setuptools.package-data]
basin_rc = ["_schemas/*.schema.json", "_schemas/README.md"]

[tool.setuptools.packages.find]
where = ["src"]
